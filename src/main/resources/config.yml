title: "<b><gradient:#BB5444:#214452>PSWORD</gradient></b> <dark_gray> >"

settings:
  particleOffsetX: 0.6
  particleOffsetY: 0.3
  particleOffsetZ: 0.6
  # How much should particles spill in X, Y and Z angles.

  particleOffsetExtra: 0.2
  # How speedy should particles be in every angle.

  # Change these settings and run /ps reload to see the effects in-game
  effectShowOnPlayersOnly: true
  abilitiesFireOnPlayersOnly: true

swords:
  "test_sword":
    name: "<b><rainbow>TEST SWORD"
    lore:
      - "<red>Red"
      - "<green>Green"
      - "<blue>Blue"
    material: DIAMOND_SWORD
    effects:
      # Particles must be this type: https://minecraft.wiki/w/Particles
      # Trigger should be one of these: ON_HIT_CRIT, ON_KILL, ON_DAMAGE_DEAL, ON_DAMAGE_RECEIVE
      - type: PARTICLE
        trigger: ON_HIT_CRIT
        particle_type: soul
        multiplier: 1.0

      # LIGHTNING effect type doesn't have any options, only needs a trigger just like any other effect type.
      - type: LIGHTNING
        trigger: ON_KILL

      # Sounds must be this type: https://minecraft.wiki/w/Sounds.json/Java_Edition_values
      - type: SOUND
        trigger: ON_HIT_CRIT
        sound: block.trial_spawner.eject_item
        volume: 1.0
        pitch: 0.5
    abilities:
      # EFFECT_SELF,
      #    EFFECT_SINGLE,
      #    EFFECT_RADIUS,
      #    LIGHTNING_BOLT,
      #    LIFE_STEAL,
      #    DASH,
      #    BLINK
      - type: EFFECT_SELF
        name: "Test Effect #1"
        trigger: ON_HIT_CRIT
        cooldown_millis: 1500
        effect_type: slowness
        duration_seconds: 30
        level: 2

      - type: EFFECT_SINGLE
        name: "Test Effect #2"
        trigger: ON_DAMAGE_DEAL
        cooldown_millis: 1500
        effect_type: blindness
        duration_seconds: 30
        level: 1

      - type: EFFECT_RADIUS
        name: "Test Effect #3"
        trigger: ON_DAMAGE_DEAL
        cooldown_millis: 1500
        effect_type: levitation
        duration_seconds: 5
        level: 1

      - type: LIGHTNING_BOLT
        name: "Test Effect #4"
        trigger: ON_DAMAGE_DEAL
        cooldown_millis: 1500
        lightning_damage: 5.0 # 1 heart: 2 damage.




